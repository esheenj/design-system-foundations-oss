name: Publish CI-verified design token playground
on:
  workflow_run:
    workflows: ["Offline checks"]
    branches: [main]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: public-design-token-pages
  cancel-in-progress: false
jobs:
  pages:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact CI-verified public source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Refuse stale main commits
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA" || {
            echo "::error::Newer main source exists; refusing stale Pages deployment.";
            exit 1;
          }
      - name: Confirm pre-enabled Pages Actions source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output /tmp/pages-status.json \
            --write-out '%{http_code}' --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")"
          if [[ "$code" != '200' ]]; then
            echo "::error::Pages unavailable (HTTP $code). Enable Settings > Pages > GitHub Actions once."
            exit 1
          fi
          test "$(jq -r '.build_type // "unknown"' /tmp/pages-status.json)" = 'workflow' || {
            echo "::error::Pages source must be GitHub Actions.";
            exit 1;
          }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Stage exact public token playground
        run: node scripts/stage_pages.mjs dist/pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages
      - name: Deploy staged static site
        id: deployment
        uses: actions/deploy-pages@v4
